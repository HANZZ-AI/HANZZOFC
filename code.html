<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HANZZ REDEEM CODE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            padding: 28px 20px 40px;
            position: relative;
            background-color: #0a0a0a;
        }

        /* Background dengan gambar ukuran 19:6 (background.png) - SAMA DENGAN LOGIKA SEBELUMNYA */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('background.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            opacity: 0.75;
            z-index: -2;
        }

        /* Overlay gelap agar teks tetap terbaca */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        /* Container utama premium */
        .redeem-container {
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
            animation: fadeInUp 0.7s ease-out;
        }

        /* Judul Besar Merah Neon */
        .main-title {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #ff0000;
            text-shadow: 
                0 0 5px #ff0000,
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #ff3300,
                0 0 80px #ff3300;
            animation: neonPulse 1.2s ease-in-out infinite alternate;
            display: inline-block;
            background: rgba(0,0,0,0.3);
            padding: 0 16px;
            border-radius: 20px;
        }

        @keyframes neonPulse {
            0% {
                text-shadow: 
                    0 0 2px #ff0000,
                    0 0 5px #ff0000,
                    0 0 10px #ff0000,
                    0 0 20px #ff3300;
                opacity: 0.95;
            }
            100% {
                text-shadow: 
                    0 0 8px #ff0000,
                    0 0 18px #ff0000,
                    0 0 35px #ff4444,
                    0 0 70px #ff0000,
                    0 0 110px #ff3300;
                opacity: 1;
            }
        }

        /* Box dengan border RGB merah */
        .redemption-box {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border: 2px solid rgb(255, 0, 0);
            border-radius: 32px;
            padding: 32px 28px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4), inset 0 0 10px rgba(255, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .redemption-box:hover {
            border-color: rgb(255, 60, 30);
            box-shadow: 0 0 45px rgba(255, 0, 0, 0.7);
        }

        .instruction {
            text-align: center;
            color: #ffaaaa;
            font-weight: 600;
            margin-bottom: 24px;
            font-size: 1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(255,0,0,0.2);
            display: inline-block;
            width: 100%;
            padding: 8px;
            border-radius: 60px;
        }

        /* Input field premium */
        .code-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 3px;
            background: #111;
            border: 2px solid #ff3333;
            border-radius: 60px;
            color: #ff5555;
            font-family: monospace;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.4);
        }

        .code-input:focus {
            border-color: #ff6666;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            background: #1a1a1a;
            color: #ff8888;
        }

        /* Tombol verifikasi premium dengan efek sama seperti index3 */
        .btn-verify {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 28px;
            padding: 14px 24px;
            border: none;
            border-radius: 80px;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.1) inset;
            backdrop-filter: blur(4px);
            gap: 12px;
            cursor: pointer;
            background: linear-gradient(105deg, #9b1d1d, #cc0000, #ff3300);
            background-size: 200% auto;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: white;
        }

        .btn-verify:hover {
            background-position: right center;
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 0 28px #ff3300, 0 0 18px rgba(255, 51, 0, 0.9);
        }

        .btn-verify:active {
            transform: translateY(3px) scale(0.98);
            transition: 0.05s;
        }

        .btn-verify::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 70%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.35), 
                transparent);
            transform: skewX(-30deg);
            transition: left 0.65s ease;
            pointer-events: none;
        }

        .btn-verify:hover::before {
            left: 150%;
        }

        /* Pesan error / sukses */
        .message-area {
            margin-top: 24px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 12px;
            border-radius: 50px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .error-msg {
            color: #ff8888;
            text-shadow: 0 0 4px #ff0000;
            border: 1px solid #ff6666;
        }

        .success-msg {
            color: #88ff88;
            text-shadow: 0 0 4px #00aa00;
            border: 1px solid #66ff66;
        }

        /* Tombol kembali ke beranda (optional biar user bisa balik) */
        .back-home {
            margin-top: 35px;
            display: inline-block;
            text-align: center;
        }

        .back-link {
            color: #ddd;
            text-decoration: none;
            font-size: 0.85rem;
            border-bottom: 1px dashed #ff5555;
            padding-bottom: 4px;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #ff8888;
            border-bottom-color: #ff8888;
        }

        /* Footer */
        .footer-redeem {
            margin-top: 40px;
            font-size: 0.7rem;
            color: #aaa;
            text-align: center;
            border-top: 1px solid rgba(255, 70, 40, 0.4);
            padding-top: 18px;
            width: 100%;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 550px) {
            .redeem-container {
                max-width: 94%;
            }
            h1 {
                font-size: 2rem;
                letter-spacing: 2px;
            }
            .code-input {
                font-size: 1.1rem;
                padding: 14px 16px;
                letter-spacing: 2px;
            }
            .btn-verify {
                font-size: 1rem;
                padding: 12px 18px;
            }
            .redemption-box {
                padding: 24px 18px;
            }
        }

        @media (max-width: 420px) {
            h1 {
                font-size: 1.6rem;
            }
            .instruction {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="redeem-container">
        <!-- Tulisan besar merah neon HANZZ REDEM CODE -->
        <div class="main-title">
            <h1>HANZZ REDEEM CODE</h1>
        </div>

        <!-- Box dengan border RGB merah -->
        <div class="redemption-box">
            <div class="instruction">
                MASUKKAN REDEEM CODE
            </div>
            <!-- Input untuk memasukan Redeem Code -->
            <input type="text" id="redeemCodeInput" class="code-input" placeholder="Masukan Redeem Code" autocomplete="off" spellcheck="false">
            
            <!-- Tombol verifikasi -->
            <button id="verifyBtn" class="btn-verify">
               <span>CONFIRM</span>
            </button>
            
            <!-- Tempat menampilkan pesan hasil validasi -->
            <div id="messageBox" class="message-area"></div>
        </div>

        <!-- Link kembali ke halaman utama (opsional, memperbaiki navigasi) -->
        <div class="back-home">
            <a href="index3.html" class="back-link">← Kembali ke HANZZ ORDER</a>
        </div>

        <div class="footer-redeem">
            Dev by HANZZ
        </div>
    </div>

    <script>
        // Ambil element yang diperlukan
        const inputField = document.getElementById('redeemCodeInput');
        const verifyButton = document.getElementById('verifyBtn');
        const messageBox = document.getElementById('messageBox');

        // Fungsi untuk menampilkan pesan
        function showMessage(text, isError = true) {
            messageBox.textContent = text;
            if (isError) {
                messageBox.className = 'message-area error-msg';
            } else {
                messageBox.className = 'message-area success-msg';
            }
            // Pesan akan hilang dengan sendirinya jika diperlukan (tapi tidak wajib, lebih baik tetap sampai next action)
            // Tapi biar user nyaman jika ada error bisa hilang saat mulai getol
        }

        // Fungsi untuk menghapus spasi dan membandingkan dengan code tetap "QWERTY" (case-sensitive besar kecil)
        function validateAndRedeem() {
            // Ambil nilai input, hapus spasi di awal & akhir
            let enteredCode = inputField.value.trim();
            
            // Code yang benar adalah "QWERTY" (case-sensitive, huruf besar semua)
            const validCode = "QWERTY";
            
            // Validasi: jika input kosong kasih tahu
            if (enteredCode === "") {
                showMessage("❌ Code Salah! Silahkan Coba Lagi", true);
                return;
            }
            
            // Bandingkan secara tepat (case-sensitive)
            if (enteredCode === validCode) {
                // Jika BENAR: arahkan ke WhatsApp dengan pesan spesifik
                const waUrl = "https://wa.me/6283196463931?text=Bang+Hanzz+Mau+Klaim+Kode+Rendem+Code+QWERTY++🔥";
                // Tampilkan pesan sukses sebentar lalu redirect (agar user merasa diarahkan)
                showMessage("✅ Kode BENAR! ", false);
                // Beri waktu sedikit biar user bisa melihat pesan sukses (200ms cukup)
                setTimeout(() => {
                    window.location.href = waUrl;
                }, 400);
            } else {
                // Jika SALAH: muncul pesan error "Code Salah Silahkan Coba Lagi"
                showMessage("❌ Code Salah! Silahkan Coba Lagi", true);
                // Kosongkan input agar user bisa mengetik ulang dengan lebih mudah (opsional)
                // Tapi jangan direset semua agar user bisa melihat perbedaan, biarkan tidak direset.
                // Namun supaya nyaman kita kasih sedikit seleksi pada input
                inputField.select();
            }
        }
        
        // Event listener untuk tombol verify
        verifyButton.addEventListener('click', validateAndRedeem);
        
        // Juga jika user menekan tombol "Enter" di dalam input field
        inputField.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                validateAndRedeem();
            }
        });
        
        // Efek tambahan: fokus awal pada input
        setTimeout(() => {
            inputField.focus();
        }, 100);
        
        // Optional: memberikan efek sedikit notifikasi khusus jika input berubah warna
        // Tidak mengubah logika bawaan.
    </script>
</body>
</html>
