<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HANZZ ORDER</title>
    <!-- Font Awesome 6 (Free CDN) untuk fab / ikon brand & solid -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            padding: 28px 20px 40px;
            position: relative;
            background-color: #0a0a0a;
        }

        /* Background dengan gambar ukuran 19:6 (background.png) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('background.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            opacity: 0.75;
            z-index: -2;
        }

        /* Overlay gelap agar teks tetap terbaca */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        /* Container utama premium */
        .linktree-container {
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        /* Bagian Profil / Avatar + Nama & Bio */
        .profile-section {
            text-align: center;
            margin-bottom: 28px;
            animation: fadeInUp 0.7s ease-out;
        }

        .avatar-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #ff2a2a, #ff0000, #cc0000);
            border-radius: 50%;
            padding: 3px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.7), 0 0 10px rgba(255, 80, 0, 0.5);
            transition: transform 0.25s ease, box-shadow 0.3s;
        }

        .avatar-wrapper:hover {
            transform: scale(1.03);
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.9);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #1a1a1a;
            display: block;
        }

        .profile-name {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ff4d4d, #ffb3b3);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px rgba(255, 30, 30, 0.4);
            margin-top: 10px;
        }

        .profile-bio {
            font-size: 0.9rem;
            color: #f0f0f0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 500;
            margin-top: 12px;
            border: 1px solid rgba(255, 80, 40, 0.6);
            letter-spacing: 0.5px;
        }

        /* Judul HANZZ ORDER dengan efek neon merah berkedip */
        .brand-neon {
            text-align: center;
            margin-bottom: 28px;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ff0000;
            text-shadow: 
                0 0 5px #ff0000,
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #ff3300,
                0 0 80px #ff3300;
            animation: neonPulse 1.2s ease-in-out infinite alternate;
            display: inline-block;
            background: rgba(0,0,0,0.3);
            padding: 0 12px;
            border-radius: 20px;
        }

        @keyframes neonPulse {
            0% {
                text-shadow: 
                    0 0 2px #ff0000,
                    0 0 5px #ff0000,
                    0 0 10px #ff0000,
                    0 0 20px #ff3300;
                opacity: 0.95;
            }
            100% {
                text-shadow: 
                    0 0 8px #ff0000,
                    0 0 18px #ff0000,
                    0 0 35px #ff4444,
                    0 0 70px #ff0000,
                    0 0 110px #ff3300;
                opacity: 1;
            }
        }

        /* Container tombol premium */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            margin-top: 8px;
        }

        /* Desain tombol super keren dengan efek glassmorphism + gradasi intens */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 14px 24px;
            border: none;
            border-radius: 80px;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.1) inset;
            backdrop-filter: blur(4px);
            gap: 18px;
            cursor: pointer;
        }

        /* Ikon tombol menggunakan Font Awesome (fab) atau SVG */
        .btn-icon {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            transition: transform 0.2s ease;
            flex-shrink: 0;
            font-size: 1.7rem;
            color: white;
        }

        /* Teks tombol modern */
        .btn-text {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
            flex: 1;
            text-align: left;
        }

        /* Tombol 1 - WA (green neon premium) */
        .btn-red {
            background: linear-gradient(105deg, #075E54, #128C7E, #25D366);
            background-size: 200% auto;
            box-shadow: 0 0 14px rgba(37, 211, 102, 0.6);
        }
        .btn-red:hover {
            background-position: right center;
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 0 28px #25D366, 0 0 18px rgba(37, 211, 102, 0.9);
        }

        /* Tombol 2 - Channel WA (gradasi teal gelap) */
        .btn-blue {
            background: linear-gradient(105deg, #05463e, #128C7E, #1bd3b6);
            background-size: 200% auto;
            box-shadow: 0 0 14px rgba(18, 140, 126, 0.7);
        }
        .btn-blue:hover {
            background-position: right center;
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 0 28px #1bd3b6, 0 0 18px rgba(27, 211, 182, 0.8);
        }

        /* Tombol 3 - Telegram Personal (biru electric) */
        .btn-green {
            background: linear-gradient(105deg, #0055a4, #0088cc, #33aaff);
            background-size: 200% auto;
            box-shadow: 0 0 14px rgba(0, 136, 204, 0.7);
        }
        .btn-green:hover {
            background-position: right center;
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 0 28px #00a6ff, 0 0 20px rgba(0, 170, 255, 0.8);
        }

        /* Tombol 4 - Telegram Channel (biru premium + sentuhan ungu gradasi) */
        .btn-purple {
            background: linear-gradient(105deg, #1c5399, #2AABEE, #6fbfef);
            background-size: 200% auto;
            box-shadow: 0 0 14px rgba(42, 171, 238, 0.7);
        }
        .btn-purple:hover {
            background-position: right center;
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 0 28px #2AABEE, 0 0 22px rgba(42, 171, 238, 0.9);
        }

        /* Tombol 5 - Rendem Code (merah menyala premium) - tetap dengan logo SVG */
        .btn-crimson {
            background: linear-gradient(105deg, #9b1d1d, #cc0000, #ff3300);
            background-size: 200% auto;
            box-shadow: 0 0 14px rgba(255, 51, 0, 0.7);
        }
        .btn-crimson:hover {
            background-position: right center;
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 0 28px #ff3300, 0 0 20px rgba(255, 51, 0, 0.9);
        }

        /* TOMBOL BARU: BUY IN WEB (warna merah solid, berbeda dari redeem) */
        .btn-web-buy {
            background: linear-gradient(105deg, #b91c1c, #dc2626, #ef4444);
            background-size: 200% auto;
            box-shadow: 0 0 14px rgba(220, 38, 38, 0.7);
        }
        .btn-web-buy:hover {
            background-position: right center;
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 0 28px #ef4444, 0 0 20px rgba(239, 68, 68, 0.9);
        }

        /* TOMBOL APK HANZZ MINIGAMES - UNGU NEON */
        .btn-purple-neon {
            background: linear-gradient(105deg, #6a0dad, #9b30ff, #c084fc);
            background-size: 200% auto;
            box-shadow: 0 0 14px rgba(156, 48, 255, 0.7);
        }
        .btn-purple-neon:hover {
            background-position: right center;
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 0 28px #b85cff, 0 0 20px rgba(156, 48, 255, 0.9);
        }

        /* TOMBOL FREE APK BUG WA - SAMA SEPERTI TOMBOL WA (btn-red) */
        /* menggunakan class btn-red yang sudah ada */

        /* Efek garis cahaya super keren saat hover */
        .btn-google::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 70%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.35), 
                transparent);
            transform: skewX(-30deg);
            transition: left 0.65s ease;
            pointer-events: none;
        }

        .btn-google:hover::before {
            left: 150%;
        }

        /* Efek klik */
        .btn-google:active {
            transform: translateY(3px) scale(0.98);
            transition: 0.05s;
        }

        /* Animasi fade masuk */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer elegan */
        .footer-note {
            margin-top: 45px;
            font-size: 0.75rem;
            color: #ddd;
            text-align: center;
            border-top: 1px solid rgba(255, 100, 60, 0.4);
            padding-top: 20px;
            width: 100%;
            backdrop-filter: blur(5px);
            font-weight: 500;
        }

        .footer-note span {
            color: #ff5e5e;
            font-weight: 700;
            text-shadow: 0 0 3px rgba(255,0,0,0.5);
        }

        /* Responsive touch */
        @media (max-width: 550px) {
            .linktree-container {
                max-width: 94%;
            }
            h1 {
                font-size: 2.3rem;
                letter-spacing: 3px;
            }
            .profile-name {
                font-size: 1.6rem;
            }
            .btn-text {
                font-size: 1rem;
                letter-spacing: 1px;
            }
            .btn-icon {
                width: 30px;
                height: 30px;
                font-size: 1.4rem;
            }
            .avatar-wrapper {
                width: 100px;
                height: 100px;
            }
            .button-container {
                gap: 16px;
            }
            .btn-google {
                padding: 12px 20px;
            }
        }

        @media (max-width: 420px) {
            .btn-text {
                font-size: 0.85rem;
                white-space: normal;
                line-height: 1.3;
            }
            .btn-icon {
                font-size: 1.3rem;
            }
            h1 {
                font-size: 1.9rem;
            }
        }

        /* Memastikan tombol selalu rapi */
        .btn-google {
            text-decoration: none;
        }
        
        /* style untuk SVG icon pada tombol Redeem Code tetap rapi */
        .svg-icon {
            width: 28px;
            height: 28px;
            fill: white;
            display: block;
        }
        @media (max-width: 550px) {
            .svg-icon {
                width: 24px;
                height: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="linktree-container">
        <!-- Profil dengan icon.png -->
        <div class="profile-section">
            <div class="avatar-wrapper">
                <img src="icon.png" alt="HANZZ Avatar" class="avatar-img" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'45\' fill=\'%23cc2222\'/%3E%3Ctext x=\'50\' y=\'67\' font-size=\'46\' text-anchor=\'middle\' fill=\'white\' font-weight=\'bold\'%3EH%3C/text%3E%3C/svg%3E';">

        <!-- Tombol-tombol dengan ikon premium & layout rapi -->

                <span class="btn-icon">
                    <i class="fab fa-shopify"></i>

            <!-- TOMBOL BARU: APK HANZZ MINIGAMES (UNGU NEON) -->

            <!-- TOMBOL BARU: FREE APK BUG WA (WARNA SAMA SEPERTI TOMBOL WA - btn-red) -->
            <a href="https://chat.whatsapp.com/BaTf6RS5TmQKeGYA6Rg39O" class="btn-google btn-red" target="_blank" rel="noopener noreferrer">

            <!-- 1. WhatsApp Contact (Nomor WA) - Font Awesome fab fa-whatsapp -->
            <a href="https://wa.me/6283196463931?text=Bang+Order" class="btn-google btn-red" target="_blank" rel="noopener noreferrer">

                    <i class="fab fa-whatsapp"></i>
                </span>
                <span class="btn-text">Contact Wa HANZZ 📞</span>

            <!-- 2. Join Channel WhatsApp - Font Awesome fab fa-whatsapp (brand) -->

            <!-- 3. Telegram Personal Contact - Font Awesome fab fa-telegram-plane -->

            </a>

            <!-- 4. Telegram Channel - Font Awesome fab fa-telegram -->
            <a href="https://t.me/HANZZOFC" class="btn-google btn-purple" target="_blank" rel="noopener noreferrer">

        </div>

        <div class="footer-note">
            <span>HANZZ ORDER</span> • Dev by HANZZ
        </div>
    </div>

    <script>
        // tambahan efek klik pada tombol BUY IN WEB
        const buyWebBtn = document.getElementById('buyInWebBtn');
        if (buyWebBtn) {
            buyWebBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'web.html';
            });
        }
    </script>
</body>
</html>
