    <style>
        /* RESET & GLOBAL - OPTIMASI RINGAN */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 30% 10%, #0a0505 0%, #000000 100%);
            font-family: 'Inter', 'Space Grotesk', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Background lebih ringan dengan efek grain halus (tanpa blur berlebihan) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, rgba(255,40,40,0.02) 0px, rgba(255,40,40,0.02) 1px, transparent 1px, transparent 4px),
                radial-gradient(circle at 20% 50%, rgba(255,50,50,0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(200,0,0,0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Efek border glow halus di pinggiran layar (lebih hemat resource) */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 80px rgba(255,0,0,0.15), inset 0 0 30px rgba(255,0,0,0.25);
            pointer-events: none;
            z-index: 0;
            animation: softPulse 3s ease-in-out infinite;
        }

        @keyframes softPulse {
            0% { box-shadow: inset 0 0 80px rgba(255,0,0,0.1), inset 0 0 30px rgba(255,0,0,0.2); }
            50% { box-shadow: inset 0 0 100px rgba(255,40,40,0.25), inset 0 0 50px rgba(255,0,0,0.35); }
            100% { box-shadow: inset 0 0 80px rgba(255,0,0,0.1), inset 0 0 30px rgba(255,0,0,0.2); }
        }

        /* KONTINER VIDEO - Rasio 4:3 dengan efek premium & ringan */
        .video-container {
            position: relative;
            width: min(86vw, 420px);
            aspect-ratio: 4 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            background: rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 2;
        }

        /* Border gradien yang lebih ringan (tanpa blur berlebihan) */
        .video-container::before {
            content: "";
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, #ff2a2a, #b30000, #ff4d4d, #cc0000);
            border-radius: 27px;
            z-index: -1;
            animation: borderShift 3s ease infinite;
            opacity: 0.7;
        }

        @keyframes borderShift {
            0% { background-position: 0% 50%; background-size: 200% 200%; filter: hue-rotate(0deg);}
            50% { background-position: 100% 50%;}
            100% { background-position: 0% 50%;}
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 22px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.7), 0 0 0 2px rgba(255,80,80,0.25);
            transition: transform 0.25s ease, filter 0.25s;
            will-change: transform;
        }

        .video-container:hover video {
            transform: scale(1.01);
            filter: brightness(1.03) contrast(1.05);
        }

        /* TULISAN HANZZ OFFICIAL - Efek neon modern & ringan */
        h1 {
            position: relative;
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: clamp(2.3rem, 9vw, 4.2rem);
            font-weight: 800;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin: 28px 0 22px;
            text-align: center;
            background: linear-gradient(135deg, #ffffff, #ffb8b8, #ff3a3a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 12px rgba(255,40,40,0.5);
            animation: gentleFlicker 2.5s infinite alternate;
            z-index: 2;
        }

        @keyframes gentleFlicker {
            0% { text-shadow: 0 0 4px #ff4040, 0 0 8px #cc0000; opacity: 0.96;}
            100% { text-shadow: 0 0 12px #ff6666, 0 0 20px #ff1a1a; opacity: 1;}
        }

        /* TOMBOL CONTINUE - desain premium, animasi halus */
        .btn-continue {
            position: relative;
            padding: 14px 52px;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            color: white;
            background: linear-gradient(105deg, #e60000, #a00000);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 2.5px;
            box-shadow: 0 10px 24px -10px rgba(255,0,0,0.5), 0 0 8px rgba(255,60,60,0.4);
            backdrop-filter: blur(2px);
            z-index: 3;
            overflow: hidden;
        }

        .btn-continue::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.55s ease;
        }

        .btn-continue:hover::before {
            left: 100%;
        }

        .btn-continue:hover {
            background: linear-gradient(105deg, #ff2a2a, #c20000);
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 18px 32px -10px #ff0000, 0 0 18px #ff4d4d;
        }

        .btn-continue:active {
            transform: scale(0.97);
            transition: 0.05s;
        }

        /* Partikel / sparkle ringan (tidak membebani) */
        .sparkle-light {
            position: absolute;
            background: radial-gradient(circle, #ff5a5a, #ff0000);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            filter: blur(1px);
            animation: sparkFloat 2s forwards ease-out;
        }

        @keyframes sparkFloat {
            0% { transform: translateY(0) scale(0.5); opacity: 0.6; }
            70% { opacity: 0.8; transform: translateY(-18px) scale(1.2); }
            100% { transform: translateY(-35px) scale(0.4); opacity: 0; }
        }

        /* Animasi fade in ringan untuk konten utama */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .video-container, h1, .btn-continue {
            animation: fadeUp 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
            opacity: 0;
        }

        h1 {
            animation-delay: 0.12s;
        }

        .btn-continue {
            animation-delay: 0.28s;
        }

        /* Efek hover pada video container - ringan */
        .video-container {
            transition: box-shadow 0.25s;
        }

        .video-container:hover {
            box-shadow: 0 0 0 3px rgba(255,60,60,0.35), 0 0 0 6px rgba(180,0,0,0.15);
        }

        /* Responsive untuk mobile */
        @media (max-width: 550px) {
            body {
                padding: 15px;
            }
            .btn-continue {
                padding: 12px 36px;
                font-size: 1rem;
                letter-spacing: 2px;
            }
            h1 {
                letter-spacing: 3px;
                margin: 22px 0 18px;
            }
            .video-container {
                width: min(92vw, 360px);
            }
        }

        /* Scrollbar elegan & ringan */
        ::-webkit-scrollbar {
            width: 4px;
            background: #1a0505;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff2a2a;
            border-radius: 10px;
        }

        /* Fallback untuk performa: pastikan tidak ada heavy shadow berulang */
        .btn-continue, .video-container {
            will-change: transform;
        }
        
        /* Efek tambahan: teks "HANZZ OFFICIAL" dengan gradient lebih tajam */
        @supports (background-clip: text) {
            h1 {
                background-size: 150% auto;
            }
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video autoplay loop muted playsinline disablePictureInPicture>
            <source src="dashboard.mp4" type="video/mp4">
            Browser Anda tidak mendukung tag video.
        </video>
    </div>

    <h1>HANZZ OFFICIAL</h1>

    <a href="index2.html" class="btn-continue">CONTINUE</a>

    <script>
        (function() {
            // Membuat partikel / sparkle ringan namun tidak mengganggu performa
            // Menggunakan requestAnimationFrame dan interval yang efisien
            let sparkleInterval = null;
            let isPageActive = true;

            function createLightSparkle() {
                if (!isPageActive) return;
                const body = document.body;
                if (!body) return;
                
                const spark = document.createElement('div');
                spark.className = 'sparkle-light';
                // Posisi acak di area sekitar video & tombol (bawah/atas)
                const randomX = Math.random() * window.innerWidth;
                const baseY = window.innerHeight * 0.55;
                const randomY = baseY + (Math.random() * 120) - 40;
                spark.style.left = randomX + 'px';
                spark.style.top = randomY + 'px';
                spark.style.width = Math.random() * 5 + 2 + 'px';
                spark.style.height = spark.style.width;
                spark.style.opacity = '0.7';
                body.appendChild(spark);
                
                spark.addEventListener('animationend', () => {
                    if (spark && spark.parentNode) spark.remove();
                });
            }

            // Interval lebih hemat (hanya membuat sparkle setiap 1.2 detik, tidak overload)
            if (window.innerWidth > 768) {
                sparkleInterval = setInterval(() => {
                    if (document.hasFocus() && isPageActive) {
                        createLightSparkle();
                        if (Math.random() > 0.65) createLightSparkle(); // kadang double
                    }
                }, 1400);
            } else {
                // mobile lebih jarang
                sparkleInterval = setInterval(() => {
                    if (document.hasFocus() && isPageActive) {
                        createLightSparkle();
                    }
                }, 1900);
            }

            // Hentikan interval saat page hidden untuk performa
            const handleVisibilityChange = () => {
                isPageActive = !document.hidden;
            };
            document.addEventListener('visibilitychange', handleVisibilityChange);
            
            // Bersihkan interval jika diperlukan (halaman ditutup)
            window.addEventListener('beforeunload', () => {
                if (sparkleInterval) clearInterval(sparkleInterval);
            });
            
            // Efek tambahan: tombol continue minor click ripple tanpa overkill
            const btn = document.querySelector('.btn-continue');
            if (btn) {
                btn.addEventListener('click', function(e) {
                    // efek micro press sudah dihandle CSS, hanya tambahan kehalusan
                    this.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        if (this) this.style.transform = '';
                    }, 120);
                });
            }

            // Optimasi video: pastikan autoplay berjalan lancar (tidak diblokir)
            const videoElem = document.querySelector('video');
            if (videoElem) {
                videoElem.addEventListener('canplaythrough', () => {
                    videoElem.play().catch(e => console.log('Autoplay prevented:', e));
                });
                // memastikan loop
                videoElem.loop = true;
            }
            
            // Menambahkan efek hover shadow yang smooth pada card video
            console.log('HANZZ OFFICIAL | Lightweight & Premium Loaded');
        })();
    </script>
    <!-- Meta tambahan untuk performa dan keamanan ringan -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
</body>
